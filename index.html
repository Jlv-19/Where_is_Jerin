<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Visit Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">Field Visit Dashboard</div>

    <div class="status-hub">
        <div class="hub-item">
            <span class="hub-icon">⏱️</span>
            <div id="datetime">Loading clock...</div>
        </div>
        <div class="hub-divider"></div>
        <div class="hub-footer">
            <span id="time">Last synced: --</span>
            <span class="hub-dot">•</span>
            <span id="visitCount">Views: Loading...</span>
        </div>
    </div>

    <div id="summary" class="card"></div>

    <div id="yesterday" class="card"></div>
    <div id="today" class="card today"></div>
    <div id="tomorrow" class="card"></div>

    <div class="nav">
        <a href="history.html">View Visit History →</a>
    </div>

</div>

<script src="script.js" defer></script>
</body>
</html>
</html>
